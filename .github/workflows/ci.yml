name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: llm-fingerprint-detector/package-lock.json
      - name: Build and test One Token detector
        working-directory: llm-fingerprint-detector
        run: |
          npm ci
          npm test
      - name: Install auditor
        run: pip install -e '.[dev]'
      - name: Test console JavaScript
        run: node --test tests/web_status.test.js
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
